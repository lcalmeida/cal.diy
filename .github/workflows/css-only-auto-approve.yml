# CSS-only PR auto-approval. Policy and rules: scripts/pr-policy/css-only.sh
#
# ⚠️ SECURITY: pull_request_target runs this file from the base branch with a write token.
# Never check out or execute PR code here. The script only reads PR metadata through the API,
# so a PR cannot change the rules it is judged by (workflow/script changes are not CSS anyway).
#
# Requires repo setting: Settings > Actions > General >
# "Allow GitHub Actions to create and approve pull requests".
name: CSS-only auto-approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  enforce:
    name: CSS-only policy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Base branch only: the policy itself must come from trusted code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/pr-policy
      - run: scripts/pr-policy/css-only.sh "$PR" --enforce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
